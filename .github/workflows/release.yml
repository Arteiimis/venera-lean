name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Rust toolchain
        run: rustup show
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --exclude-tags environment
      - name: Validate version metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tool/check_version.py
      - name: Whitespace check
        run: git diff --check

  android:
    name: Android APKs
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Rust toolchain
        run: rustup show
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 secret is required'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
      - name: Write signing properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD secret is required'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS secret is required'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD secret is required'; exit 1; }
          cat > android/key.properties <<EOF
          storeFile=../release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Verify signing keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore android/release.keystore \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null
      - name: Dependencies
        run: flutter pub get
      - name: Build signed APKs
        run: flutter build apk --release
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/apk/release/*.apk dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    name: Windows portable
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Rust toolchain
        run: rustup show
        shell: pwsh
      - name: Dependencies
        run: flutter pub get
        shell: pwsh
      - name: Build Windows app
        run: flutter build windows --release
        shell: pwsh
      - name: Package portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' -AllMatches).Matches[0].Groups[1].Value.Split('+')[0]
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/venera-lean-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Read version
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: //' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Venera Lean ${{ steps.version.outputs.version }}" \
            --notes-file "doc/release-${{ steps.version.outputs.version }}.md" \
            --verify-tag
